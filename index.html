<!DOCTYPE html>
<html>
<head>
    <title>Fatter Matter Calorie Tracker</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            text-align: center;
            background: linear-gradient(#ffeb99, #ffb84d, #ff9933);
            color: #5a2e00;
        }

        header {
            background-color: #ff9900;
            padding: 25px;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .button {
            display: block;
            margin: 12px auto;
            padding: 12px;
            width: 260px;
            background-color: #ffcc33;
            color: #5a2e00;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            border: 2px solid #ff9900;
        }

        .button:hover {
            background-color: #ffb84d;
        }

        .section {
            background: #fff7e6;
            margin: 40px;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #ffcc33;
        }

        .placeholder {
            width: 200px;
            height: 200px;
            background: #ffe0b3;
            margin: auto;
            border-radius: 12px;
            padding-top: 80px;
            color: #5a2e00;
            font-size: 16px;
        }

        footer {
            background-color: #ff9900;
            padding: 15px;
            color: white;
            margin-top: 40px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        Fatter Matter Calorie Tracker
        <p>Main Page</p>
    </header>

    <!-- ⭐ WELCOME MESSAGE ⭐ -->
    <p id="status" style="font-size:20px; font-weight:bold; margin-top:20px;"></p>

    <h2>Account</h2>

    <!-- ⭐ LOGIN / SIGNUP (only when logged out) ⭐ -->
    <a class="button" id="loginBtn" href="login.html">Login</a>
    <a class="button" id="signupBtn" href="signup.html">Sign Up</a>

    <!-- ⭐ SIGN OUT (only when logged in) ⭐ -->
    <button class="button" id="logoutBtn" style="display:none;">Sign Out</button>

    <h2>Links</h2>

    <a class="button" href="FMCT_Proj_Purpose.html">Project Purpose</a>
    <a class="button" href="FMCT_Parts.html">Parts I Used</a>
    <a class="button" href="FMCT_How_It_Helps.html">How It Helps People</a>
    <a class="button" href="FMCT_User_Instructions.html">User Instructions</a>
    <a class="button" href="FMCT_Challenges.html">Challenges I Faced</a>

    <div class="section">
        <h2>Picture</h2>
        <div class="placeholder">Your picture will go here</div>
    </div>

    <footer>
        Fatter Matter Calorie Tracker
    </footer>

    <!-- ⭐ FIREBASE SDK ⭐ -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAZVkqvd1HJaAFA9JjUsk3HuYahO7-m_qc",
            authDomain: "fmct-58e22.firebaseapp.com",
            projectId: "fmct-58e22",
            storageBucket: "fmct-58e22.firebasestorage.app",
            messagingSenderId: "479095036843",
            appId: "1:479095036843:web:e800df57bb2b01f5f4d0ee"
        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        const loginBtn = document.getElementById("loginBtn");
        const signupBtn = document.getElementById("signupBtn");
        const logoutBtn = document.getElementById("logoutBtn");

        auth.onAuthStateChanged(async (user) => {
            const status = document.getElementById("status");

            if (user) {
                const doc = await db.collection("users").doc(user.uid).get();

                let name = "Welcome!";
                if (doc.exists && doc.data().firstName) {
                    name = "Welcome, " + doc.data().firstName + "!";
                }

                status.innerHTML = name;

                // ⭐ SHOW ONLY SIGN OUT
                loginBtn.style.display = "none";
                signupBtn.style.display = "none";
                logoutBtn.style.display = "block";

            } else {
                status.innerHTML = "You are not logged in.";

                // ⭐ SHOW LOGIN + SIGNUP, HIDE SIGN OUT
                loginBtn.style.display = "block";
                signupBtn.style.display = "block";
                logoutBtn.style.display = "none";
            }
        });

        // ⭐ SIGN OUT ⭐
        logoutBtn.onclick = async () => {
            await auth.signOut();
            window.location.reload();
        };
    </script>

</body>
</html>

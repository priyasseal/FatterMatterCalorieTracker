<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMCT - Log In</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: linear-gradient(to bottom, #fff3d6, #ffe0b3, #ffcc80);
        }

        /* --- LEFT CONTAINER (FORM) --- */
        .left-container {
            width: 45%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 50px;
            box-shadow: 5px 0 25px rgba(0,0,0,0.05);
            z-index: 2;
        }

        .header-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(to right, #ff9900, #ff7043);
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(255,153,0,0.3);
            text-decoration: none;
            width: fit-content;
        }

        .login-box {
            max-width: 340px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        .login-box h2 {
            font-size: 26px;
            font-weight: bold;
            color: #5a2e00;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            font-size: 15px;
            border: 2px solid #ffd580;
            border-radius: 15px;
            outline: none;
            transition: border-color 0.2s ease;
            color: #5a2e00;
            background-color: #fffdf9;
        }

        .input-field:focus {
            border-color: #ff9900;
        }

        .btn-letsgo {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: linear-gradient(to bottom, #ff9900, #e67e22);
            border: 2px solid #d35400;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(230,126,34,0.3);
            transition: transform 0.1s ease, background 0.2s ease;
            margin-top: 10px;
        }

        .btn-letsgo:hover {
            background: linear-gradient(to bottom, #ff8800, #d35400);
            transform: translateY(-2px);
        }

        .forgot-link {
            display: inline-block;
            margin-top: 18px;
            color: #e67e22;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .back-home {
            color: #8d6e63;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
        }

        .back-home:hover {
            color: #5a2e00;
        }

        /* --- RIGHT CONTAINER (BURGER ART & TAGLINE) --- */
        .right-container {
            width: 55%;
            height: 100%;
            background: linear-gradient(to bottom, #ffcc80, #ffb347);
            background-image: radial-gradient(#ffa726 15%, transparent 16%);
            background-size: 45px 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        /* DINNER PLATE & JUMPING BURGER ART */
        .art-stage {
            position: relative;
            width: 220px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .dinner-plate {
            width: 200px;
            height: 35px;
            background: #ffffff;
            border-radius: 50%;
            border-bottom: 6px solid #e0d0b0;
            box-shadow: 0 12px 25px rgba(90,46,0,0.15);
            position: relative;
            z-index: 1;
        }

        .dinner-plate-inner {
            width: 150px;
            height: 22px;
            background: #f7f9fa;
            border-radius: 50%;
            margin: 3px auto 0 auto;
        }

        .jumping-burger {
            font-size: 85px;
            position: absolute;
            bottom: 25px;
            z-index: 2;
            animation: bounceBurger 1.6s infinite ease-in-out;
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.15));
        }

        @keyframes bounceBurger {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-45px) scale(1.05);
            }
        }

        .plate-shadow {
            width: 140px;
            height: 12px;
            background: rgba(90,46,0,0.15);
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            z-index: 0;
            animation: shadowPulse 1.6s infinite ease-in-out;
        }

        @keyframes shadowPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(0.7);
                opacity: 0.1;
            }
        }

        .tagline {
            color: #5a2e00;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            max-width: 380px;
            line-height: 1.4;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <!-- LEFT SIDE: LOGIN FORM -->
    <div class="left-container">
        <div>
            <a href="index.html" class="header-logo">🍔 FMCT</a>
        </div>

        <div class="login-box">
            <h2>Log in</h2>
            
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="usernameEmail" class="input-field" placeholder="Username or email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" class="input-field" placeholder="Password" required>
                </div>
                
                <button type="submit" class="btn-letsgo">Let's go!</button>
            </form>

            <a href="#" class="forgot-link" onclick="alert('Please contact your administrator to reset your password.'); return false;">Forgot your password?</a>
        </div>

        <div>
            <a href="index.html" class="back-home">← Back to Main Dashboard</a>
        </div>
    </div>

    <!-- RIGHT SIDE: ANIMATED ART & TAGLINE -->
    <div class="right-container">
        <div class="art-stage">
            <div class="jumping-burger">🍔</div>
            <div class="dinner-plate">
                <div class="dinner-plate-inner"></div>
            </div>
            <div class="plate-shadow"></div>
        </div>

        <div class="tagline">
            The cognitive app behind every bite.
        </div>
    </div>

    <!-- FIREBASE AUTH SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAZVkqvd1HJaAFA9JjUsk3HuYahO7-m_qc",
            authDomain: "fmct-58e22.firebaseapp.com",
            projectId: "fmct-58e22",
            storageBucket: "fmct-58e22.firebasestorage.app",
            messagingSenderId: "479095036843",
            appId: "1:479095036843:web:e800df57bb2b01f5f4d0ee"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('usernameEmail').value;
            const password = document.getElementById('password').value;

            try {
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = "index.html";
            } catch (error) {
                alert("Login failed: " + error.message);
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMCT - Sign Up</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: linear-gradient(to bottom, #fff8ec, #ffe5b4);
        }

        .main-wrapper {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        .left-container {
            width: 45%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 50px;
            box-shadow: 5px 0 25px rgba(46,204,113,0.05);
            z-index: 2;
        }

        .header-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(to right, #2ecc71, #27ae60);
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(46,204,113,0.3);
            text-decoration: none;
            width: fit-content;
        }

        .signup-box {
            max-width: 340px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        .signup-box h2 {
            font-size: 26px;
            font-weight: bold;
            color: #1e8449;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            font-size: 15px;
            border: 2px solid #a9dfbf;
            border-radius: 15px;
            outline: none;
            color: #1e8449;
            background-color: #f4fcf7;
        }

        .input-field:focus {
            border-color: #2ecc71;
        }

        .btn-signup-action {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
            border: 2px solid #1e8449;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(46,204,113,0.3);
            margin-top: 10px;
        }

        .btn-signup-action:hover {
            background: linear-gradient(to bottom, #27ae60, #1e8449);
        }

        #errorMsg {
            margin-top: 12px;
            font-size: 13px;
            font-weight: bold;
            color: #d32f2f;
            min-height: 18px;
        }

        .login-link-text {
            margin-top: 18px;
            font-size: 13px;
            color: #8d6e63;
        }

        .login-link-text a {
            color: #e67e22;
            font-weight: bold;
            text-decoration: none;
        }

        .right-container {
            width: 55%;
            height: 100%;
            background: linear-gradient(to bottom, #d5f5e3, #a9dfbf);
            background-image: radial-gradient(#2ecc71 15%, transparent 16%);
            background-size: 45px 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .tagline {
            color: #145a32;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            max-width: 400px;
            line-height: 1.4;
        }

        footer {
            background: #3e2723;
            color: #ffcc80;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            border-top: 4px solid #e67e22;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="left-container">
            <div>
                <a href="index.html" class="header-logo">🍔 FMCT</a>
            </div>

            <div class="signup-box">
                <h2>Create Account</h2>
                <form id="signupForm">
                    <div class="input-group">
                        <input type="email" id="email" class="input-field" placeholder="Email address" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" class="input-field" placeholder="Password (min 6 chars)" required>
                    </div>
                    <button type="submit" id="submitBtn" class="btn-signup-action">Sign Up</button>
                    <div id="errorMsg"></div>
                </form>
                <div class="login-link-text">
                    Already have an account? <a href="login.html">Log in</a>
                </div>
            </div>

            <div>
                <a href="index.html" style="color: #8d6e63; font-size: 13px; font-weight: bold; text-decoration: none;">← Back to Home</a>
            </div>
        </div>

        <div class="right-container">
            <div class="tagline">Start your smart, mindful calorie tracking journey today.</div>
        </div>
    </div>

    <footer>
        Priyadarshini Seal copyright 2026
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZVkqvd1HJaAFA9JjUsk3HuYahO7-m_qc",
            authDomain: "fmct-58e22.firebaseapp.com",
            projectId: "fmct-58e22",
            storageBucket: "fmct-58e22.firebasestorage.app",
            messagingSenderId: "479095036843",
            appId: "1:479095036843:web:e800df57bb2b01f5f4d0ee",
            measurementId: "G-8HCFJHX7HG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');

            errorMsg.style.color = "#1e8449";
            errorMsg.innerText = "Creating account...";
            submitBtn.disabled = true;

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                window.location.href = "trend.html";
            } catch (error) {
                errorMsg.style.color = "#d32f2f";
                errorMsg.innerText = error.message;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
